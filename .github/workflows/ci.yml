name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: attesta
          POSTGRES_PASSWORD: attesta
          POSTGRES_DB: attesta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attesta -d attesta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://attesta:attesta@localhost:5432/attesta_test
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Includes the tests that use the real database above.
      - name: Unit and database tests
        run: npm test

      - name: Build
        run: npm run build

      # Starts the build just made, with its own mail stand-in and signing keys, and drives it over HTTP.
      - name: End-to-end tests
        run: npm run test:e2e
